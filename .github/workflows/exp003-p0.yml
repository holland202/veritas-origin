name: EXP003-P0 verification

on:
  pull_request:
    paths:
      - "experiments/exp003/**"
      - "src/origin/exp003.py"
      - "tests/test_exp003*.py"
      - "tools/verify_exp003_p0.py"
      - ".github/workflows/exp003-p0.yml"
  push:
    branches:
      - "experiment/exp003-p0-substrate"
    paths:
      - "experiments/exp003/**"
      - "src/origin/exp003.py"
      - "tests/test_exp003*.py"
      - "tools/verify_exp003_p0.py"
      - ".github/workflows/exp003-p0.yml"

permissions:
  contents: read

jobs:
  static-and-behavioral:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile EXP003 modules
        run: |
          python3 --version
          python3 -m py_compile src/origin/exp003.py tools/verify_exp003_p0.py
      - name: Run EXP003 unit and adversarial replay tests
        run: |
          python3 -m unittest discover -s tests -p 'test_exp003*.py' -v
      - name: Verify EXP002 historical evidence remains replayable
        run: |
          python3 tools/verify_exp002.py
      - name: Verify archived EXP003-P0 evidence and its SHA-256
        run: |
          FILE=evidence/exp003/exp003-p0-20261008T202705724022Z-146bee1a.json
          HASH=627eb778e8eef80d9d664c9ac6f3b7743d51e6a97a677eea8cac51e79b467333
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum -c -
          python3 tools/verify_exp003_p0.py "$FILE" --sha256 "$HASH"
