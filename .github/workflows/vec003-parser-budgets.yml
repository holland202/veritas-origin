name: VEC-003 parser budgets (registered)

on:
  push:
    branches:
      - experiment/vec003-parser-budgets
    paths:
      - "research/evidence_circuit/**"
      - ".github/workflows/vec003-parser-budgets.yml"
  pull_request:
    paths:
      - "research/evidence_circuit/**"
      - ".github/workflows/vec003-parser-budgets.yml"

permissions:
  contents: read

jobs:
  depth-and-resource:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: VEC-003 registered depth / CPU / memory boundary probes
        working-directory: research/evidence_circuit/vec003
        run: python -I test_vec003.py
