name: EBA-001 evaluator-boundary falsification

on:
  push:
    branches:
      - experiment/eba001-evaluator-boundary-attack
    paths:
      - "src/origin/eba001.py"
      - "tools/verify_eba001.py"
      - "tools/plot_eba001.py"
      - "tests/test_eba001.py"
      - "experiments/eba001/**"
      - "reports/eba001/**"
      - ".github/workflows/eba001.yml"
  pull_request:
    paths:
      - "src/origin/eba001.py"
      - "tools/verify_eba001.py"
      - "tools/plot_eba001.py"
      - "tests/test_eba001.py"
      - "experiments/eba001/**"
      - "reports/eba001/**"
      - ".github/workflows/eba001.yml"

permissions:
  contents: read

jobs:
  synthetic-evaluator-attack:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only origin checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Commit-pinned actual Sovereign Veritas gate for inherited RA tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: holland202/sovereign-veritas
          ref: 709da9eb435cbfe06a1ca00427843b12c673ceb0
          path: .external_sv
          persist-credentials: false

      - name: Compile EBA-001 and run all original and negative controls
        env:
          SV_REPO_PATH: ${{ github.workspace }}/.external_sv
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile src/origin/eba001.py tools/verify_eba001.py tools/plot_eba001.py
          python3 tools/research_assurance.py
          python3 -m unittest discover -s tests -p 'test_exp003*.py' -v
          python3 -m unittest discover -s tests -p 'test_research_assurance.py' -v
          python3 -m unittest discover -s tests -p 'test_eba001.py' -v

      - name: Run preregistered EBA-001 toy scenarios with fresh immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(python3 src/origin/eba001.py --pilot --output-dir "${RUNNER_TEMP}/eba001-evidence")"
          printf '%s\n' "$OUT"
          FILE="$(printf '%s\n' "$OUT" | sed -n 's/^EVIDENCE: //p')"
          SHA="$(printf '%s\n' "$OUT" | sed -n 's/^SHA256: //p')"
          test -f "$FILE"
          printf '%s  %s\n' "$SHA" "$FILE" | sha256sum --check
          python3 tools/verify_eba001.py "$FILE" --sha256 "$SHA"
          mkdir -p "${RUNNER_TEMP}/eba001-archive"
          cp "$FILE" "${RUNNER_TEMP}/eba001-archive/eba001-original-public-simulation.json"
          python3 tools/plot_eba001.py "$FILE" --sha256 "$SHA" \
            --output-dir "${RUNNER_TEMP}/eba001-archive"
          {
            echo "### EBA-001 — Evaluator Boundary Attack (EXPLORATORY / TOY / NOT VALIDATED)"
            echo "- Original full record SHA256: `$SHA`"
            echo "- 12 public synthetic seeds; clean context-only vs oracle-informed external-policy transcripts"
            echo "- Registered E2: mathematically consistent but visibly oracle-contaminated"
            echo "- Registered E9: **KNOWN FALSE CLEAN** from a forged self-reported complete access log"
            echo "- The original EXP003-P0 independent verifier and an independent EBA-001 replayer check the transcripts"
            echo "- No untrusted subprocess or real model ran; OS isolation, authentication and authorization NOT ESTABLISHED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive exact evidence and two visualization files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eba001-raw-evidence-and-figures
          path: ${{ runner.temp }}/eba001-archive
          retention-days: 30
          if-no-files-found: error

      - name: Re-verify historic untouched EXP003-P0 evidence
        shell: bash
        run: |
          set -euo pipefail
          FILE=evidence/exp003/exp003-p0-20261008T202705724022Z-146bee1a.json
          SHA=627eb778e8eef80d9d664c9ac6f3b7743d51e6a97a677eea8cac51e79b467333
          printf '%s  %s\n' "$SHA" "$FILE" | sha256sum --check
          python3 tools/verify_exp003_p0.py "$FILE" --sha256 "$SHA"
