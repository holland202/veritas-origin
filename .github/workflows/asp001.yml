name: ASP-001 internally regulated neural learning

on:
  push:
    branches:
      - experiment/asp001-internal-plasticity-regulation
    paths:
      - "src/origin/asp001.py"
      - "tools/verify_asp001.py"
      - "tools/plot_asp001.py"
      - "tests/test_asp001.py"
      - "experiments/asp001/**"
      - "reports/asp001/**"
      - ".github/workflows/asp001.yml"
  pull_request:
    paths:
      - "src/origin/asp001.py"
      - "tools/verify_asp001.py"
      - "tools/plot_asp001.py"
      - "tests/test_asp001.py"
      - "experiments/asp001/**"
      - "reports/asp001/**"
      - ".github/workflows/asp001.yml"

permissions:
  contents: read

jobs:
  neural-plasticity-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read-only checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fixed NumPy environment
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip install 'numpy==2.2.6'
          python - <<'PY'
          import numpy
          assert numpy.__version__=="2.2.6",numpy.__version__
          print("NUMPY_PINNED",numpy.__version__)
          PY

      - name: Compile and adversarially test real neural network and independent verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/origin/asp001.py tools/verify_asp001.py tools/plot_asp001.py
          python -m unittest discover -s tests -p 'test_asp001.py' -v

      - name: Recheck untouched historical EXP003-P0
        shell: bash
        run: |
          set -euo pipefail
          FILE=evidence/exp003/exp003-p0-20261008T202705724022Z-146bee1a.json
          HASH=627eb778e8eef80d9d664c9ac6f3b7743d51e6a97a677eea8cac51e79b467333
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --check
          python tools/verify_exp003_p0.py "$FILE" --sha256 "$HASH"
          python -m unittest discover -s tests -p 'test_exp003*.py' -v

      - name: Preregistered engineering smoke, exact hash, independent replay
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(python src/origin/asp001.py --pilot --smoke --output-dir "${RUNNER_TEMP}/asp001-smoke")"
          printf '%s\n' "$OUTPUT"
          FILE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^EVIDENCE: //p')"
          HASH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SHA256: //p')"
          test -f "$FILE"
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --check
          python tools/verify_asp001.py "$FILE" --sha256 "$HASH"

      - name: Registered 24-seed full experiment and independent numerical replay
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(python src/origin/asp001.py --pilot --output-dir "${RUNNER_TEMP}/asp001-results")"
          printf '%s\n' "$OUTPUT"
          FILE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^EVIDENCE: //p')"
          HASH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SHA256: //p')"
          test -f "$FILE"
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --check
          python tools/verify_asp001.py "$FILE" --sha256 "$HASH"
          mkdir -p "${RUNNER_TEMP}/asp001-archive"
          cp "$FILE" "${RUNNER_TEMP}/asp001-archive/asp001-public-exploratory.json"
          python tools/plot_asp001.py "$FILE" --sha256 "$HASH" \
            --output-dir "${RUNNER_TEMP}/asp001-archive"
          python - "$FILE" "$HASH" "${RUNNER_TEMP}/asp001-archive" <<'PY'
          import json, sys, pathlib, hashlib, os
          f=pathlib.Path(sys.argv[1]); digest=sys.argv[2]
          path=pathlib.Path(sys.argv[3])/"source-and-evidence-manifest.json"
          source_files=["experiments/asp001/PROTOCOL.md","src/origin/asp001.py",
                        "tools/verify_asp001.py","tools/plot_asp001.py",
                        "tests/test_asp001.py"]
          j=json.loads(f.read_text())
          manifest={
              "protocol":"ASP-001",
              "source_commit":os.environ["GITHUB_SHA"],
              "original_evidence_sha256":digest,
              "evidence_status":j["status"],
              "numpy_version":j["numpy_version"],
              "seeds":j["seeds"],
              "H1":j["summary"]["H1"],
              "files":{x:hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest()
                       for x in source_files},
              "limits":["Only one small NumPy neural network on public math tasks",
                        "No external domain, no biological equivalence, no signed authorization"],
          }
          path.write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print("MANIFEST:",path)
          print("MANIFEST_SHA256:",hashlib.sha256(path.read_bytes()).hexdigest())
          PY
          {
            echo "### ASP-001 internally regulated real neural network"
            echo "- 24 public seeds, 6 policies, A→B→A, 64 x 3 shared minibatch updates"
            echo "- Full evidence SHA256: `$HASH`"
            echo "- Independent NumPy reconstruction passed, including learned weights and modulator signals"
            echo "- Primary endpoint: clean A/B joint MSE after B; all controls and negative results retained"
            echo "- **EXPLORATORY / NOT VALIDATED**; NOT biological chemistry, general intelligence or LLM research"
            echo "- Raw evidence, source manifest and figures in 30-day CI artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve exact raw data, source digest manifest and replay-qualified figures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asp001-neural-plasticity-full-evidence
          path: ${{ runner.temp }}/asp001-archive
          if-no-files-found: error
          retention-days: 30
