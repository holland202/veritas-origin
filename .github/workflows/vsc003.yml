name: VSC-003 costed weak verification research

on:
  push:
    branches:
      - experiment/vsc003-costed-weak-verification
    paths:
      - "src/origin/vsc003.py"
      - "tools/verify_vsc003.py"
      - "tools/plot_vsc003.py"
      - "tests/test_vsc003.py"
      - "experiments/vsc003/**"
      - "reports/vsc003/**"
      - ".github/workflows/vsc003.yml"
  pull_request:
    paths:
      - "src/origin/vsc003.py"
      - "tools/verify_vsc003.py"
      - "tools/plot_vsc003.py"
      - "tests/test_vsc003.py"
      - "experiments/vsc003/**"
      - "reports/vsc003/**"
      - ".github/workflows/vsc003.yml"

permissions:
  contents: read

jobs:
  falsification-and-independent-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compile study, replay verifier and chart script
        run: |
          set -eu
          python3 --version
          python3 -m py_compile src/origin/vsc003.py tools/verify_vsc003.py tools/plot_vsc003.py
          python3 -m unittest discover -s tests -p 'test_vsc001.py' -v
          python3 -m unittest discover -s tests -p 'test_vsc002.py' -v
          python3 -m unittest discover -s tests -p 'test_vsc003.py' -v

      - name: Public two-seed engineering smoke and independent replay
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(python3 src/origin/vsc003.py --pilot --seed-base 40404 \
            --seeds 2 --generations 3 --output-dir "${RUNNER_TEMP}/vsc003-smoke")"
          printf '%s\n' "$OUTPUT"
          FILE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^EVIDENCE: //p')"
          HASH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SHA256: //p')"
          test -f "$FILE"
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --check
          python3 tools/verify_vsc003.py "$FILE" --sha256 "$HASH"

      - name: Predeclared 24-public-seed exploratory run and six charts
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(python3 src/origin/vsc003.py --pilot --seed-base 20261033 \
            --seeds 24 --generations 10 --output-dir "${RUNNER_TEMP}/vsc003-evidence")"
          printf '%s\n' "$OUTPUT"
          FILE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^EVIDENCE: //p')"
          HASH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SHA256: //p')"
          test -f "$FILE"
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --check
          python3 tools/verify_vsc003.py "$FILE" --sha256 "$HASH"
          mkdir -p "${RUNNER_TEMP}/vsc003-archive"
          cp "$FILE" "${RUNNER_TEMP}/vsc003-archive/vsc003-public-exploratory.json"
          python3 tools/plot_vsc003.py "$FILE" --sha256 "$HASH" \
            --output-dir "${RUNNER_TEMP}/vsc003-archive"
          echo "### VSC-003 preregistered exploratory public-fixture results" >> "$GITHUB_STEP_SUMMARY"
          echo "- 24 public seeds, ten generations, eleven policies" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binary weak check = 1 credit; direct truth-label query = 6 credits; cost budget = 12 credits/generation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Raw original JSON SHA256: `$HASH`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **EXPLORATORY SIMULATED NOT VALIDATED**; same-process mathematical oracle, no language-model training" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence and six SVGs uploaded as 30-day artifact; preserve separately before expiration" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive VSC-003 exact raw JSON and source-data SVGs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 MIT
        with:
          name: vsc003-public-evidence-and-six-figures
          path: ${{ runner.temp }}/vsc003-archive
          if-no-files-found: error
          retention-days: 30

      - name: Preserve original EXP003-P0 evidence
        shell: bash
        run: |
          set -euo pipefail
          FILE=evidence/exp003/exp003-p0-20261008T202705724022Z-146bee1a.json
          HASH=627eb778e8eef80d9d664c9ac6f3b7743d51e6a97a677eea8cac51e79b467333
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --check
          python3 tools/verify_exp003_p0.py "$FILE" --sha256 "$HASH"
