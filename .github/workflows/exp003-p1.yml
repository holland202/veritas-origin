name: EXP003-P1 exploratory checks

on:
  pull_request:
    paths:
      - "src/origin/exp003_p1.py"
      - "tests/test_exp003_p1_*.py"
      - "tools/verify_exp003_p1.py"
      - "experiments/exp003/PROTOCOL_P1.md"
      - "experiments/exp003/THREAT_MODEL_P1.md"
      - "experiments/exp003/P1_OPERATOR_GUIDE.md"
      - ".github/workflows/exp003-p1.yml"
  push:
    branches:
      - "experiment/exp003-p1-blinded-proposer"
    paths:
      - "src/origin/exp003_p1.py"
      - "tests/test_exp003_p1_*.py"
      - "tools/verify_exp003_p1.py"
      - "experiments/exp003/PROTOCOL_P1.md"
      - "experiments/exp003/THREAT_MODEL_P1.md"
      - "experiments/exp003/P1_OPERATOR_GUIDE.md"
      - ".github/workflows/exp003-p1.yml"

permissions:
  contents: read

jobs:
  reproducibility-and-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Python source and P1 test cases
        run: |
          python3 --version
          python3 -m py_compile src/origin/exp003_p1.py tools/verify_exp003_p1.py
          python3 -m unittest discover -s tests -p 'test_exp003_p1_*.py' -v

      - name: Run publicly seeded engineering smoke pilot and independent verification
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(python3 src/origin/exp003_p1.py \
            --pilot --task-count 6 \
            --test-secret-hex 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --allow-public-test-secret \
            --output-dir "${RUNNER_TEMP}/exp003-p1-smoke")"
          printf '%s\n' "$OUTPUT"
          FILE="$(printf '%s\n' "$OUTPUT" | sed -n 's/^EVIDENCE: //p')"
          HASH="$(printf '%s\n' "$OUTPUT" | sed -n 's/^SHA256: //p')"
          test -f "$FILE"
          test "${#HASH}" -eq 64
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --check
          python3 tools/verify_exp003_p1.py "$FILE" --sha256 "$HASH"

      - name: Confirm archived P0 remains independently replayable
        shell: bash
        run: |
          set -euo pipefail
          FILE=evidence/exp003/exp003-p0-20261008T202705724022Z-146bee1a.json
          HASH=627eb778e8eef80d9d664c9ac6f3b7743d51e6a97a677eea8cac51e79b467333
          printf '%s  %s\n' "$HASH" "$FILE" | sha256sum --check
          python3 tools/verify_exp003_p0.py "$FILE" --sha256 "$HASH"
