<title id="title">VSC-003 final test MSE and weak versus strong verification budgets</title>
<desc id="desc">Eleven policies across 24 publicly seeded ten-generation toy simulations. Lowest mean final error was gold progress at 0.08929. Checked progress at 0.09414. Each paid arm spent 120 abstract credits, with varying training updates. Not validated for LLMs.</desc>
