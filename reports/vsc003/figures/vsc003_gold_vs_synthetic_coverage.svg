<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1230" viewBox="0 0 1500 1230" role="img" aria-labelledby="title desc">
<title id="title">VSC-003 gold evidence versus accepted synthetic input diversity</title>
<desc id="desc">After ten generations over 24 synthetic public seeds, checked progress covers 90.4 percent of input cells with accepted examples but only 63.8 percent with genuine gold labels used in training. These are different properties and verification of a pseudolabel does not turn it into a true oracle label.</desc>
