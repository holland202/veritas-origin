<svg xmlns="http://www.w3.org/2000/svg" width="1710" height="990" viewBox="0 0 1710 990" role="img" aria-labelledby="title desc">
<title id="title">ITC-001 empirical accuracy versus latent computation cost</title>
<desc id="desc">Six public model seeds, mean accuracy versus mean recurrent passes. Fixed three passes achieves 91.2598 percent macro accuracy; adaptive 91.2435 percent with 2.980 passes; fixed five 91.1730 percent at five passes. The adaptive heuristic did not meet the registered per-task shuffled allocation advantage. A post-hoc exploratory Pareto frontier, not a complexity lower bound.</desc>
