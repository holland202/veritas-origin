<text x="61" y="126" fill="#c7dced" font-family="Arial,sans-serif" font-size="23">One trained recurrent network per seed · 6 seeds · 3,072 withheld-pattern decisions per seed</text>
<text x="61" y="167" fill="#ffcd93" font-family="Arial,sans-serif" font-size="22" font-weight="bold">POST-HOC EMPIRICAL FRONTIER · NOT A STATISTICAL-COMPUTATIONAL THRESHOLD</text>
