<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
<title id="title">ASP-001: actual neural network internal regulation versus SGD and Adam</title>
<desc id="desc">Mean clean held-out joint A and B errors after 128 training updates over 24 public seeds. SGD learning rate .01 yielded 0.30122894; regulated SGD yielded 0.30548563. The regulator did not satisfy registered improvement criterion. Lower is better. Exploratory, not validated.</desc>
