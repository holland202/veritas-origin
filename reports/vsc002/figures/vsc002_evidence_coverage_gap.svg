<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1170" viewBox="0 0 1500 1170" role="img" aria-labelledby="title desc">
<title id="title">VSC-002 coverage gaps between true labels and synthetic examples</title>
<desc id="desc">In a 24-seed public synthetic experiment, the pseudo-only learner has 100 percent accepted training input coverage but only 64.6 percent gold-label coverage. Checked pseudolabels are not counted as true gold labels.</desc>
