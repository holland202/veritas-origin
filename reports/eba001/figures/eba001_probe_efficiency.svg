<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="925" viewBox="0 0 1500 925" role="img" aria-labelledby="title desc">
<title id="title">EBA-001 public twelve-task efficiency of honest and contaminated experiment selectors</title>
<desc id="desc">The context-only greedy selector used 24 probes and an inadmissible oracle-informed selector used 13. It was faster in eleven of twelve tasks, but this is invalid as a comparison of scientific strategies because the latter knows the answer. All are synthetic, public tasks.</desc>
<rect width="1500" height="925" fill="#071a2b"/>
<rect x="26" y="26" width="1448" height="872" rx="28" fill="#13293f" stroke="#37607c" stroke-width="2"/>
<text x="58" y="87" fill="#f1f9ff" font-family="Arial,sans-serif" font-weight="bold" font-size="38">The apparent performance gain from knowing the answer</text>
<text x="58" y="130" fill="#b9d4eb" font-family="Arial,sans-serif" font-size="23">Same 12 public toy tasks · probe count lower is better · NOT a fair strategy comparison</text>
<text x="58" y="170" fill="#ffd093" font-family="Arial,sans-serif" font-weight="bold" font-size="22">EXPLORATORY SIMULATED · NO MODEL · NOT VALIDATED</text>
