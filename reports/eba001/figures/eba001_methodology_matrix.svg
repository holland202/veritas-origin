<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="1050" viewBox="0 0 1590 1050" role="img" aria-labelledby="title desc">
<title id="title">EBA-001: Valid transcripts can conceal invalid evidence provenance</title>
<desc id="desc">Ten preregistered synthetic cases use internally consistent original P0 mathematical transcripts. Four are explicitly invalid, two unknown, one self-attested, one historical, one declared clean, one a known false clean due to a forged complete access log. No OS isolation was tested.</desc>
