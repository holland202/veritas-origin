<title id="title">VSC-001 synthetic five-seed held-out error and oracle costs</title>
<desc id="desc">Six experimental training policies compared on five publicly seeded toy simulation trials. The verified progress arm had mean squared error 0.06195 with 512 oracle calls; the balanced oracle control 0.06424 with 272 calls. Results are exploratory and not evidence of large-language-model capability or data-wall breakthrough.</desc>
